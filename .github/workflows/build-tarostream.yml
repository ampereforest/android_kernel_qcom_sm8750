name: Build 6.6.163-tarostream GKI Drop-In Kernel

on:
  push:
    branches:
      - tarostream-6.6.163
      - main
      - lineage-23.2
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'findings/**'
  workflow_dispatch:
    inputs:
      clang_version:
        description: 'AOSP main-kernel prebuilt Clang directory (e.g. clang-r614150 or clang-r547379)'
        required: false
        default: 'clang-r614150'
        type: choice
        options:
          - clang-r614150
          - clang-r596125
          - clang-r584948b
          - clang-r547379
      fetch_latest_ksu:
        description: 'Pull latest upstream root manager kernel sources at build time (recommended)'
        required: false
        default: true
        type: boolean
      lto_mode:
        description: 'LTO mode (thin = ThinLTO default, none = disable LTO)'
        required: false
        default: 'thin'
        type: choice
        options:
          - thin
          - none

concurrency:
  group: tarostream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 6.6.163-tarostream (${{ matrix.root_flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        root_flavor:
          - kernelsu
          - bakasu

    steps:
      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Free maximum disk space on runner
        run: |
          set -euo pipefail
          echo "=== Disk before cleanup ==="
          df -h / /mnt || df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver \
            /usr/local/share/chromedriver || true
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk after cleanup ==="
          df -h / /mnt || df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex lz4 dwarves libssl-dev libelf-dev cpio \
            xz-utils zstd python3 zip unzip rsync kmod curl ca-certificates git

      - name: Restore cached AOSP prebuilt Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: aosp-clang-v1-${{ inputs.clang_version || 'clang-r614150' }}

      - name: Fetch latest compatible AOSP prebuilt Clang
        env:
          CLANG_VERSION: ${{ inputs.clang_version || 'clang-r614150' }}
        run: |
          set -euo pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang"
          if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/${CLANG_VERSION}.tar.gz"
            echo "Downloading AOSP Clang ${CLANG_VERSION} from ${URL}"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$URL" | tar -xz -C "$CLANG_DIR"
          else
            echo "Using cached AOSP Clang ${CLANG_VERSION} from ${CLANG_DIR}"
          fi
          echo "${CLANG_DIR}/bin" >> "$GITHUB_PATH"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          CLANG_VER_STR="$("${CLANG_DIR}/bin/clang" --version | head -n1)"
          echo "CLANG_VERSION=${CLANG_VERSION}" >> "$GITHUB_ENV"
          echo "CLANG_VER_STR=${CLANG_VER_STR}" >> "$GITHUB_ENV"
          echo "Installed: ${CLANG_VER_STR}"
          "${CLANG_DIR}/bin/ld.lld" --version | head -n1

      - name: Fetch & integrate tiann/KernelSU (main) with SUSFS
        if: matrix.root_flavor == 'kernelsu'
        env:
          FETCH_LATEST_KSU: ${{ github.event_name == 'workflow_dispatch' && !inputs.fetch_latest_ksu && 'false' || 'true' }}
        run: |
          set -euo pipefail
          echo "ROOT_NAME=KernelSU" >> "$GITHUB_ENV"
          echo "ROOT_REPO=tiann/KernelSU" >> "$GITHUB_ENV"

          if [ "$FETCH_LATEST_KSU" != "true" ]; then
            echo "Using vendored drivers/kernelsu (KSU_VERSION=32736)"
            echo "KSU_VERSION=32736" >> "$GITHUB_ENV"
            echo "KSU_COMMIT=vendored-cfc60f8d" >> "$GITHUB_ENV"
            echo "ROOT_LINE=KernelSU 32736 (vendored)" >> "$GITHUB_ENV"
            exit 0
          fi

          KSU_DIR="${RUNNER_TEMP}/KernelSU"
          rm -rf "$KSU_DIR"
          git clone --single-branch -b main https://github.com/tiann/KernelSU.git "$KSU_DIR"
          KSU_COMMIT="$(git -C "$KSU_DIR" rev-parse HEAD)"
          KSU_COUNT="$(git -C "$KSU_DIR" rev-list --count HEAD)"
          KSU_VERSION="$((30000 + KSU_COUNT))"
          echo "Fetched tiann/KernelSU main @ ${KSU_COMMIT} (count=${KSU_COUNT} -> KSU_VERSION=${KSU_VERSION})"
          if [ "$KSU_VERSION" -le 32680 ]; then
            echo "ERROR: KSU_VERSION=${KSU_VERSION} is unexpectedly <= 32680 (shallow clone?)" >&2
            exit 1
          fi

          # Apply SUSFS enable patch onto fresh tiann/KernelSU main
          LOCAL_PATCH="${GITHUB_WORKSPACE}/.github/patches/10_enable_susfs_for_ksu.patch"
          PATCH_TO_APPLY="$LOCAL_PATCH"
          if ! patch -d "$KSU_DIR" -p1 --dry-run --forward -f < "$LOCAL_PATCH" >/dev/null 2>&1; then
            echo "Local 10_enable_susfs_for_ksu.patch did not dry-run clean; fetching latest upstream susfs4ksu patch..."
            UPSTREAM_PATCH="${RUNNER_TEMP}/10_enable_susfs_for_ksu.patch"
            curl -fsSL --retry 5 --retry-delay 5 \
              "https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android15-6.6/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
              -o "$UPSTREAM_PATCH"
            PATCH_TO_APPLY="$UPSTREAM_PATCH"
          fi
          patch -d "$KSU_DIR" -p1 --forward < "$PATCH_TO_APPLY"
          REJ="$(find "$KSU_DIR" -name '*.rej' -print -quit)"
          if [ -n "$REJ" ]; then
            echo "ERROR: SUSFS enable patch left rejects: $REJ" >&2
            exit 1
          fi

          # Guard selinux_hide.c pointer-bool-conversion under Clang -Werror (idempotent)
          SELINUX_HIDE="$KSU_DIR/kernel/feature/selinux_hide.c"
          if [ -f "$SELINUX_HIDE" ] && grep -q "extern void security_dump_masked_av_fn" "$SELINUX_HIDE"; then
            sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$SELINUX_HIDE"
            sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$SELINUX_HIDE"
            sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$SELINUX_HIDE"
            sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$SELINUX_HIDE"
          fi

          # Install patched KernelSU kernel tree cleanly into drivers/kernelsu
          rm -rf drivers/kernelsu
          cp -a "$KSU_DIR/kernel" drivers/kernelsu
          if [ -L drivers/kernelsu/include/uapi ]; then
            rm -f drivers/kernelsu/include/uapi
            cp -a "$KSU_DIR/uapi" drivers/kernelsu/include/uapi
          fi

          # Pin dynamically computed KSU_VERSION in drivers/kernelsu/Kbuild fallback
          KSU_VERSION="$KSU_VERSION" python3 - <<'PY'
          import os
          p = "drivers/kernelsu/Kbuild"
          ver = os.environ["KSU_VERSION"]
          s = open(p).read()
          old = "ccflags-y += -DKSU_VERSION=16"
          new = f"KSU_VERSION ?= {ver}\nccflags-y += -DKSU_VERSION=$(KSU_VERSION)"
          if old in s:
              s = s.replace(old, new, 1)
          elif "KSU_VERSION ?=" not in s:
              s += f"\nKSU_VERSION := {ver}\nccflags-y += -DKSU_VERSION=$(KSU_VERSION)\n"
          open(p, "w").write(s)
          PY

          echo "KSU_VERSION=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=${KSU_COMMIT}" >> "$GITHUB_ENV"
          echo "ROOT_LINE=KernelSU ${KSU_VERSION} (${KSU_COMMIT:0:8})" >> "$GITHUB_ENV"
          echo "Integrated tiann/KernelSU main (${KSU_COMMIT:0:12}, KSU_VERSION=${KSU_VERSION})"

      - name: Fetch & integrate Baka-SU/BakaSU (main) with native SUSFS inline hooks
        if: matrix.root_flavor == 'bakasu'
        run: |
          set -euo pipefail
          echo "ROOT_NAME=BakaSU" >> "$GITHUB_ENV"
          echo "ROOT_REPO=Baka-SU/BakaSU" >> "$GITHUB_ENV"

          BAKASU_DIR="${GITHUB_WORKSPACE}/BakaSU"
          rm -rf "$BAKASU_DIR" drivers/kernelsu
          git clone --single-branch -b main https://github.com/Baka-SU/BakaSU.git "$BAKASU_DIR"

          KSU_COMMIT="$(git -C "$BAKASU_DIR" rev-parse HEAD)"
          KSU_COUNT="$(git -C "$BAKASU_DIR" rev-list --count HEAD)"
          # Match BakaSU/kernel/Kbuild formula: 30000 + rev-list + 700
          KSU_VERSION="$((30000 + KSU_COUNT + 700))"
          echo "Fetched Baka-SU/BakaSU main @ ${KSU_COMMIT} (count=${KSU_COUNT} -> KSU_VERSION=${KSU_VERSION})"

          # Defensive guard if upstream ever re-adds an unconditional wait error in susfs_compat.mk
          if grep -q 'Please wait susfs update' "$BAKASU_DIR/kernel/tools/susfs_compat.mk" 2>/dev/null; then
            sed -i '/Please wait susfs update/d' "$BAKASU_DIR/kernel/tools/susfs_compat.mk"
          fi

          # Symlink drivers/kernelsu -> ../BakaSU/kernel (preserves ../.git & include/uapi -> ../../uapi)
          ln -s ../BakaSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu drivers/kernelsu/include/uapi

          echo "KSU_VERSION=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=${KSU_COMMIT}" >> "$GITHUB_ENV"
          echo "ROOT_LINE=BakaSU ${KSU_VERSION} (${KSU_COMMIT:0:8})" >> "$GITHUB_ENV"
          echo "Integrated Baka-SU/BakaSU main (${KSU_COMMIT:0:12}, KSU_VERSION=${KSU_VERSION})"

      - name: Compile 6.6.163-tarostream Image & Module.symvers
        env:
          LTO_MODE: ${{ inputs.lto_mode || 'thin' }}
          ROOT_FLAVOR: ${{ matrix.root_flavor }}
        run: |
          set -euo pipefail
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            LOCALVERSION=
            KBUILD_BUILD_USER=tarostream
            KBUILD_BUILD_HOST=tarostream
          )
          if [ "$ROOT_FLAVOR" = "kernelsu" ]; then
            MAKE_ARGS+=(KSU_VERSION="${KSU_VERSION}")
          fi

          mkdir -p out
          make "${MAKE_ARGS[@]}" gki_defconfig

          # BakaSU hooking method is a Kconfig choice defaulting to KSU_TRACEPOINT_HOOK;
          # explicitly enforce KSU_SUSFS inline hooks for our SUSFS v2.4.0 kernel tree.
          if [ "$ROOT_FLAVOR" = "bakasu" ]; then
            scripts/config --file out/.config \
              -d KSU_TRACEPOINT_HOOK \
              -d KSU_MANUAL_HOOK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e KSU_SUSFS_PRIORITY_UID_FILTER
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          if [ "$LTO_MODE" = "none" ]; then
            scripts/config --file out/.config -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          # Install UAPI headers first so KernelSU/BakaSU Kbuild enables preinit/runner.elf cleanly
          make -j"$(nproc)" "${MAKE_ARGS[@]}" headers_install

          # Build Image + in-tree modules so Module.symvers is generated for ABI verification
          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image modules

          ls -lh out/arch/arm64/boot/Image out/Module.symvers out/vmlinux.symvers || true

      - name: Auto-fetch matching Manager APK
        env:
          ROOT_FLAVOR: ${{ matrix.root_flavor }}
        run: |
          set -euo pipefail
          APK_STAGE="${RUNNER_TEMP}/manager-apk"
          rm -rf "$APK_STAGE"
          mkdir -p "$APK_STAGE"

          if [ "$ROOT_FLAVOR" = "kernelsu" ]; then
            echo "Fetching latest tiann/KernelSU Manager APK from GitHub Actions via nightly.link..."
            RUN_JSON="$(curl -fsSL --retry 5 --retry-delay 5 \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/tiann/KernelSU/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1")"
            RUN_ID="$(python3 -c 'import sys,json; r=json.load(sys.stdin)["workflow_runs"]; print(r[0]["id"] if r else "")' <<< "$RUN_JSON")"
            RUN_SHA="$(python3 -c 'import sys,json; r=json.load(sys.stdin)["workflow_runs"]; print(r[0]["head_sha"][:8] if r else "")' <<< "$RUN_JSON")"

            FETCHED_APK=""
            if [ -n "$RUN_ID" ]; then
              echo "Latest tiann/KernelSU build-manager.yml run: ${RUN_ID} (${RUN_SHA})"
              if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                "https://nightly.link/tiann/KernelSU/actions/runs/${RUN_ID}/manager.zip" \
                -o "${APK_STAGE}/manager.zip"; then
                unzip -qo "${APK_STAGE}/manager.zip" -d "${APK_STAGE}/extracted"
                FETCHED_APK="$(find "${APK_STAGE}/extracted" -type f -name '*.apk' | head -n1 || true)"
              fi
            fi

            if [ -z "$FETCHED_APK" ]; then
              echo "nightly.link fallback: fetching latest tiann/KernelSU GitHub Release APK..."
              REL_URL="$(curl -fsSL --retry 5 --retry-delay 5 \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/tiann/KernelSU/releases/latest" \
                | python3 -c 'import sys,json; assets=json.load(sys.stdin).get("assets",[]); print(next((a["browser_download_url"] for a in assets if a["name"].endswith(".apk")), ""))')"
              [ -n "$REL_URL" ] || { echo "ERROR: Could not locate KernelSU Manager APK" >&2; exit 1; }
              mkdir -p "${APK_STAGE}/extracted"
              FETCHED_APK="${APK_STAGE}/extracted/$(basename "$REL_URL")"
              curl -fsSL --retry 5 --retry-delay 5 "$REL_URL" -o "$FETCHED_APK"
            fi

            ORIG_NAME="$(basename "$FETCHED_APK")"
            VER_TAG="$(echo "$ORIG_NAME" | sed -E 's/^KernelSU_//; s/-release\.apk$//; s/\.apk$//')"
            APK_FINAL_NAME="KernelSU-Manager-${VER_TAG}.apk"
            APK_SOURCE="tiann/KernelSU CI run ${RUN_ID:-release} (${ORIG_NAME})"
          else
            echo "Fetching latest Baka-SU/BakaSU Manager APK from GitHub Actions via nightly.link..."
            RUN_JSON="$(curl -fsSL --retry 5 --retry-delay 5 \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Baka-SU/BakaSU/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1")"
            RUN_ID="$(python3 -c 'import sys,json; r=json.load(sys.stdin)["workflow_runs"]; print(r[0]["id"] if r else "")' <<< "$RUN_JSON")"
            RUN_SHA="$(python3 -c 'import sys,json; r=json.load(sys.stdin)["workflow_runs"]; print(r[0]["head_sha"][:8] if r else "")' <<< "$RUN_JSON")"
            [ -n "$RUN_ID" ] || { echo "ERROR: No successful Baka-SU/BakaSU build-manager.yml run found" >&2; exit 1; }
            echo "Latest Baka-SU/BakaSU build-manager.yml run: ${RUN_ID} (${RUN_SHA})"

            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              "https://nightly.link/Baka-SU/BakaSU/actions/runs/${RUN_ID}/Manager-release.zip" \
              -o "${APK_STAGE}/Manager-release.zip"
            unzip -qo "${APK_STAGE}/Manager-release.zip" -d "${APK_STAGE}/extracted"
            ls -lh "${APK_STAGE}/extracted"

            # Prefer arm64-v8a release APK for Xiaomi 15 (SM8750), fallback to universal
            FETCHED_APK="$(find "${APK_STAGE}/extracted" -type f -name '*arm64-v8a*.apk' | head -n1 || true)"
            if [ -z "$FETCHED_APK" ]; then
              FETCHED_APK="$(find "${APK_STAGE}/extracted" -type f -name '*universal*.apk' | head -n1 || true)"
            fi
            if [ -z "$FETCHED_APK" ]; then
              FETCHED_APK="$(find "${APK_STAGE}/extracted" -type f -name '*.apk' | head -n1 || true)"
            fi
            [ -n "$FETCHED_APK" ] || { echo "ERROR: No APK found inside Manager-release.zip" >&2; exit 1; }

            ORIG_NAME="$(basename "$FETCHED_APK")"
            VER_TAG="$(echo "$ORIG_NAME" | sed -E 's/^BakaSU_//; s/-release\.apk$//; s/\.apk$//')"
            APK_FINAL_NAME="BakaSU-Manager-${VER_TAG}.apk"
            APK_SOURCE="Baka-SU/BakaSU CI run ${RUN_ID} (${ORIG_NAME})"
          fi

          # Verify APK integrity (valid ZIP archive & > 1 MiB)
          unzip -tq "$FETCHED_APK"
          APK_BYTES="$(stat -c%s "$FETCHED_APK")"
          if [ "$APK_BYTES" -lt 1048576 ]; then
            echo "ERROR: Fetched APK is unexpectedly small (${APK_BYTES} bytes): ${FETCHED_APK}" >&2
            exit 1
          fi
          cp -f "$FETCHED_APK" "${APK_STAGE}/${APK_FINAL_NAME}"
          APK_SHA256="$(sha256sum "${APK_STAGE}/${APK_FINAL_NAME}" | awk '{print $1}')"
          echo "Verified ${APK_FINAL_NAME} (${APK_BYTES} bytes, sha256=${APK_SHA256})"

          echo "APK_FINAL_PATH=${APK_STAGE}/${APK_FINAL_NAME}" >> "$GITHUB_ENV"
          echo "APK_FINAL_NAME=${APK_FINAL_NAME}" >> "$GITHUB_ENV"
          echo "APK_SOURCE=${APK_SOURCE}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3 script & run CI Boot-Safety Gate
        env:
          ROOT_FLAVOR: ${{ matrix.root_flavor }}
        run: |
          set -euo pipefail
          AK3_DIR="${RUNNER_TEMP}/AnyKernel3"
          rm -rf "$AK3_DIR"
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git "$AK3_DIR"
          # Remove WildKernels maple leaf banner so ONLY our mobile-safe Lloyd ASCII banner prints
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/README.md" "$AK3_DIR/anykernel.sh" "$AK3_DIR/banner"
          cp -f .github/anykernel/anykernel.sh "$AK3_DIR/anykernel.sh"
          sed -i \
            -e "s|__ROOT_NAME__|${ROOT_NAME}|g" \
            -e "s|__ROOT_LINE__|${ROOT_LINE}|g" \
            -e "s|__BUILD_SHA__|${SHORT_SHA}|g" \
            -e "s|__CLANG_VER__|${CLANG_VERSION}|g" \
            "$AK3_DIR/anykernel.sh"
          chmod 0755 "$AK3_DIR/anykernel.sh"

          # Validate compiled Image, .config, F2FS parity, 9593/9593 ABI CRCs, AND rendered anykernel.sh banner
          python3 .github/scripts/verify_boot_safety.py \
            --src . \
            --out out \
            --root-flavor "${ROOT_FLAVOR}" \
            --anykernel "$AK3_DIR/anykernel.sh" \
            --report out/boot-safety-report.txt

      - name: Package AnyKernel3 flashable ZIP & Manager APK bundle
        env:
          ROOT_FLAVOR: ${{ matrix.root_flavor }}
        run: |
          set -euo pipefail
          ZIP_NAME="AnyKernel3-tarostream-6.6.163-${ROOT_FLAVOR}-${SHORT_SHA}.zip"
          AK3_DIR="${RUNNER_TEMP}/AnyKernel3"
          OUT_ART="${GITHUB_WORKSPACE}/artifacts"
          rm -rf "$OUT_ART"
          mkdir -p "$OUT_ART"

          # Double-check WildKernels maple leaf banner is absent
          test ! -e "$AK3_DIR/banner"

          cp -f out/arch/arm64/boot/Image "$AK3_DIR/Image"
          (cd "$AK3_DIR" && zip -r9 "${OUT_ART}/${ZIP_NAME}" .)
          (cd "$OUT_ART" && sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          cp -f out/.config "${OUT_ART}/tarostream-6.6.163-${ROOT_FLAVOR}-${SHORT_SHA}.config"
          cp -f out/boot-safety-report.txt "${OUT_ART}/boot-safety-report.txt"
          cp -f "${APK_FINAL_PATH}" "${OUT_ART}/${APK_FINAL_NAME}"
          ls -lh "$OUT_ART"

          {
            echo "## 6.6.163-tarostream Build Summary (\`${ROOT_FLAVOR}\`)"
            echo ""
            echo "- **AnyKernel3 ZIP:** \`${ZIP_NAME}\`"
            echo "- **Manager APK:** \`${APK_FINAL_NAME}\` (source: \`${APK_SOURCE}\`, sha256: \`${APK_SHA256:0:16}...\`)"
            echo "- **Kernel:** \`$(sed -n 's/.*"\\([^"]*\\)".*/\\1/p' out/include/generated/utsrelease.h)\`"
            echo "- **Toolchain:** \`${CLANG_VERSION}\` (\`${CLANG_VER_STR}\`)"
            echo "- **Root:** \`${ROOT_REPO}\` main @ \`${KSU_COMMIT:0:12}\` (\`KSU_VERSION=${KSU_VERSION}\`)"
            echo "- **Stack:** SUSFS v2.4.0 + NoMount + DroidSpaces + Pure EEVDF/WALT + AMU + TEO + BBR/FQ + ADIOS + NTsync"
            echo ""
            echo '```text'
            cat out/boot-safety-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 ZIP, Manager APK & verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-tarostream-6.6.163-${{ matrix.root_flavor }}-${{ steps.meta.outputs.short_sha }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
